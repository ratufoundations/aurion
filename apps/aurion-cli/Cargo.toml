[package]
name = "aurion-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing = { workspace = true }
aurion-config = { path = "../../config" }
aurion-criptografi = { path = "../../crates/aurion-criptografi" }
aurion-ledger = { path = "../../crates/aurion-ledger" }
aurion-gateway = { path = "../../crates/aurion-gateway" }

clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
zenoh = "1.0"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "1.0"

[lints]
workspace = true
