[package]
name = "aurion-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
aurion-criptografi = { path = "../../crates/aurion-criptografi" }
aurion-core = { path = "../../crates/aurion-core" }
aurion-ledger = { path = "../../crates/aurion-ledger" }

tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
