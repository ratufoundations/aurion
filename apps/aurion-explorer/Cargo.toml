[package]
name = "aurion-explorer"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
tracing = { workspace = true }
aurion-config = { path = "../../config", version = "0.1.0"}
aurion-criptografi = { path = "../../crates/aurion-criptografi", version = "0.1.0"}
aurion-core = { path = "../../crates/aurion-core", version = "0.1.0"}
aurion-ledger = { path = "../../crates/aurion-ledger", version = "0.1.0"}

tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
