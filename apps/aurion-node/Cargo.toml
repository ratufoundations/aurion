[package]
name = "aurion-node"
version = "0.1.0"
edition = "2021"

[lib]
name = "aurion_node"
path = "src/lib.rs"

[[bin]]
name = "aurion-node"
path = "src/main.rs"

[dependencies]
aurion-config = { path = "../../config" }
tracing = { workspace = true }
aurion-criptografi = { path = "../../crates/aurion-criptografi" }
aurion-core = { path = "../../crates/aurion-core" }
aurion-consensus = { path = "../../crates/aurion-consensus" }
aurion-ledger = { path = "../../crates/aurion-ledger" }
aurion-mempool = { path = "../../crates/aurion-mempool" }
aurion-network = { path = "../../crates/aurion-network" }
aurion-gateway = { path = "../../crates/aurion-gateway" }
aurion-execution = { path = "../../crates/aurion-execution" }
aurion-guard = { path = "../../crates/aurion-guard" }
aurion-projection = { path = "../../crates/aurion-projection" }
aurion-genesis = { path = "../../crates/aurion-genesis" }

tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
blake3 = "1.5"
bytes = "1"

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
