mode = "developer"

[network]
chain_id = 1001
p2p_bind_addr = "127.0.0.1:8080"
max_peers = 10
handshake_timeout_ms = 3000
seed_nodes = []

[consensus]
block_time_ms = 2000
round_timeout_ms = 4000
max_tx_per_block = 1000
quorum_threshold_percent = 67

[storage]
db_path = "target/dev_db"
max_open_files = 128
flush_interval_ms = 500

[gateway]
query_timeout_ms = 2000

[explorer]
http_bind_addr = "127.0.0.1:8545"
cors_enabled = true
cache_ttl_seconds = 2

[logging]
log_dir = "logs"
log_to_stdout = true
log_to_file = true
max_file_size_mb = 20
