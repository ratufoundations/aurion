[package]
name = "aurion-network"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
tracing = { workspace = true }
aurion-criptografi = { path = "../aurion-criptografi", version = "0.1.0"}
aurion-core = { path = "../aurion-core", version = "0.1.0"}
aurion-consensus = { path = "../aurion-consensus", version = "0.1.0"}
aurion-ledger = { path = "../aurion-ledger", version = "0.1.0"}
tokio = { version = "1.38", features = ["net", "sync", "rt", "macros", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.6"
futures-util = { version = "0.3", features = ["sink"] }
thiserror = "1.0"
# Fondasi P2P: dipin ke versi cache lokal, feature minimal (tanpa "full").
libp2p = { version = "0.56", default-features = false, features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "identify",
    "macros",
] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }

[lints]
workspace = true
