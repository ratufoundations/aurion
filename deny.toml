# deny.toml - Kebijakan kepatuhan audit supply chain Aurion
#
# Kompatibilitas cargo-deny 0.20: level lint advisori (vulnerability,
# unmaintained, yanked, notice) dikendalikan lewat bendera CLI pada
# `scripts/audit.sh`, bukan lagi di tabel [advisories]. Tabel ini hanya
# memuat basis pengecualian `ignore`.

[advisories]
# Pengecualian RUSTSEC yang terverifikasi per-tanggal; tiap butir menyebut
# ID dan alasan di komentar. TODO: tinjau ulang setiap kali rantai dependensi
# dinaikkan.
ignore = [
    # lz4_flex 0.10 dikunci vendor oleh zenoh-transport 1.10.1 (dekompresi
    # frame kawat tanpa syarat, pin semver ^0.10; perbaikan >=0.11.6). Belum
    # ada rilis zenoh yang melonggarkan; ditandai untuk pelacakan.
    "RUSTSEC-2026-0041",
    # rsa 0.9.10 (Marvin) tanpa versi terpasang yang menambal; hanya dipakai
    # jalur TLS legacy zenoh, tidak menyentuh penandatanganan konsensus
    # (ed25519/blake3). Risiko sisa diterima dan dipantau.
    "RUSTSEC-2023-0071",
]

[licenses]
# Hanya izinkan lisensi open-source standar industri
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Dibawa transitif oleh zenoh-transport 1.10.1 (zenoh-link/rustls TLS):
    # `option-ext` (MPL-2.0, file-level weak copyleft) dan
    # `webpki-roots`/`webpki-root-certs` (CDLA-Permissive-2.0, bundel
    # sertifikat akar Let's Encrypt - permisif).
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Blokir duplikasi dependensi versi ganda dan crate berisiko
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Larang crate float alternatif jika ada percobaan impor terselubung
    { name = "half" },
    # CATATAN: `twox-hash` sengaja TIDAK lagi di-deny. Ia ialah hasher xxHash
    # untuk checksum frame LZ4 pada lz4_flex, yang dikunci oleh
    # zenoh-transport 1.10.1 sebagai dependensi dekompresi frame kawat;
    # hard-deny-nya menolak seluruh build tanpa jalan keluar.
]

[sources]
# Hanya izinkan unduhan crate dari crates.io resmi dan path workspace lokal
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]